services:
  - type: web
    name: sangsik-quiz
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: sangsik-quiz-db
          property: connectionString

databases:
  - name: sangsik-quiz-db
    plan: free
